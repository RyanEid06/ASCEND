name: Android CI

on:
  push:
    branches:
      - main
      - 'phase/**'
  pull_request:
    branches:
      - main
      - 'phase/**'

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check pinned dependency policy
        run: python3 scripts/check_dependency_policy.py gradle/libs.versions.toml
      - name: Build and unit tests
        run: bash ./gradlew --no-daemon clean assembleDebug assembleRelease assembleDebugAndroidTest test
      - name: Check native libraries for 16 KB page support
        run: |
          python3 scripts/check_native_16k.py app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/check_native_16k.py app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Android lint
        run: bash ./gradlew --no-daemon lint
      - name: Stage Phase 0 debug APK
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/phase/P00-integration' }}
        run: cp app/build/outputs/apk/debug/app-debug.apk ASCEND-P0-debug.apk
      - name: Upload Phase 0 debug APK
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/phase/P00-integration' }}
        uses: actions/upload-artifact@v4
        with:
          name: ASCEND-P0-debug-${{ github.sha }}
          path: ASCEND-P0-debug.apk
          if-no-files-found: error
          retention-days: 14

  instrumented-storage-spike:
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/phase/')) || github.event_name == 'pull_request' }}
    needs: build-test-lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - name: Install compile platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run encrypted Room compatibility tests on 16 KB API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_ps16k
          arch: x86_64
          script: bash -lc 'test "$(adb shell getconf PAGE_SIZE | tr -d "\r")" = "16384" && ./gradlew --no-daemon connectedDebugAndroidTest'
