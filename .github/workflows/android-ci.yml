name: Android CI

on:
  push:
    branches:
      - main
      - 'phase/**'
  pull_request:
    branches:
      - main
      - 'phase/**'

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare permanent ASCEND signing identity
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/phase/P02-integration' || github.ref == 'refs/heads/phase/P03-integration' || github.ref == 'refs/heads/main') }}
        env:
          ASCEND_KEYSTORE_BASE64: ${{ secrets.ASCEND_KEYSTORE_BASE64 }}
          ASCEND_KEYSTORE_PASSWORD: ${{ secrets.ASCEND_KEYSTORE_PASSWORD }}
          ASCEND_KEY_ALIAS: ${{ secrets.ASCEND_KEY_ALIAS }}
          ASCEND_KEY_PASSWORD: ${{ secrets.ASCEND_KEY_PASSWORD }}
        run: |
          test -n "$ASCEND_KEYSTORE_BASE64"
          test -n "$ASCEND_KEYSTORE_PASSWORD"
          test -n "$ASCEND_KEY_ALIAS"
          test -n "$ASCEND_KEY_PASSWORD"
          printf '%s' "$ASCEND_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ascend-release.jks"
          chmod 600 "$RUNNER_TEMP/ascend-release.jks"
          echo "ASCEND_KEYSTORE_PATH=$RUNNER_TEMP/ascend-release.jks" >> "$GITHUB_ENV"
          echo "ASCEND_KEYSTORE_PASSWORD=$ASCEND_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ASCEND_KEY_ALIAS=$ASCEND_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ASCEND_KEY_PASSWORD=$ASCEND_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Check pinned dependency policy
        run: python3 scripts/check_dependency_policy.py gradle/libs.versions.toml
      - name: Check local storage privacy contract
        run: python3 scripts/check_local_storage_contract.py
      - name: Check front annotation schema and synthetic fixtures
        run: |
          python3 -m pip install jsonschema==4.23.0
          python3 scripts/check_front_fixtures.py
      - name: Build and unit tests
        run: bash ./gradlew --no-daemon clean assembleDebug assembleRelease assembleDebugAndroidTest test
      - name: Check native libraries for 16 KB page support
        run: |
          python3 scripts/check_native_16k.py app/build/outputs/apk/debug/app-debug.apk
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$RELEASE_APK"
          echo "Checking release APK: $RELEASE_APK"
          python3 scripts/check_native_16k.py "$RELEASE_APK"
          python3 scripts/check_native_16k.py app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Verify Phase 2 signed QA APK
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/phase/P02-integration' }}
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print -quit)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk ASCEND-P2-QA-signed.apk
      - name: Upload Phase 2 signed QA APK
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/phase/P02-integration' }}
        uses: actions/upload-artifact@v4
        with:
          name: ASCEND-P2-QA-${{ github.sha }}
          path: ASCEND-P2-QA-signed.apk
          if-no-files-found: error
          retention-days: 30
      - name: Android lint
        run: bash ./gradlew --no-daemon lint
      - name: Verify and stage Phase 3 QA APKs
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/phase/P03-integration' }}
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print -quit)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk > ASCEND-P3-provenance.txt
          # Public certificate identity verified from the existing P2 QA artifact.
          grep -F 'certificate SHA-256 digest: b9565110d18e91bbdd6a0cbff0b238d39771c1357646bcb6c0cb7f11a73bb9d8' ASCEND-P3-provenance.txt
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt -print -quit)"
          test -n "$AAPT"
          "$AAPT" dump badging app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/p3-badging.txt"
          grep -F "package: name='app.ascend.mobile' versionCode='3' versionName='0.3.0'" "$RUNNER_TEMP/p3-badging.txt" >> ASCEND-P3-provenance.txt
          if grep -q '^application-debuggable' "$RUNNER_TEMP/p3-badging.txt"; then exit 1; fi
          printf '\nGit commit: %s\n' "$GITHUB_SHA" >> ASCEND-P3-provenance.txt
          sha256sum app/src/main/assets/face_landmarker.task >> ASCEND-P3-provenance.txt
          cp app/build/outputs/apk/release/app-release.apk ASCEND-P3-QA-signed.apk
          cp app/build/outputs/apk/debug/app-debug.apk ASCEND-P3-dev.apk
          sha256sum ASCEND-P3-QA-signed.apk ASCEND-P3-dev.apk >> ASCEND-P3-provenance.txt
      - name: Upload Phase 3 QA APKs
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/phase/P03-integration' }}
        uses: actions/upload-artifact@v4
        with:
          name: ASCEND-P3-QA-${{ github.sha }}
          path: |
            ASCEND-P3-QA-signed.apk
            ASCEND-P3-dev.apk
            ASCEND-P3-provenance.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload schemas and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            app/schemas/
            app/build/reports/
            app/build/test-results/
      - name: Stage Phase 0 debug APK
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/phase/P00-integration' }}
        run: cp app/build/outputs/apk/debug/app-debug.apk ASCEND-P0-debug.apk
      - name: Upload Phase 0 debug APK
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/phase/P00-integration' }}
        uses: actions/upload-artifact@v4
        with:
          name: ASCEND-P0-debug-${{ github.sha }}
          path: ASCEND-P0-debug.apk
          if-no-files-found: error
          retention-days: 14

  instrumented-storage-spike:
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/phase/')) || github.event_name == 'pull_request' }}
    needs: build-test-lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - name: Install compile platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Free disk space for the 16 KB emulator
        run: |
          echo "Free space before cleanup:"
          df -h / /home/runner
          # The 16 KB system image needs ~7.4 GB free to create its 4 GB userdata
          # partition, and a hosted runner is left with only ~7.19 GB once the
          # Android SDK and system image are installed. Reclaim the toolchains
          # this project never uses: there is no NDK/CMake build, no .NET, no GHC,
          # no Boost and no CodeQL analysis in this workflow.
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/swift
          sudo apt-get clean
          echo "Free space after cleanup:"
          df -h / /home/runner
      - name: Run encrypted storage, migration and restart tests on 16 KB API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_ps16k
          arch: x86_64
          script: |
            test "$(adb shell getconf PAGE_SIZE | tr -d '\r')" = "16384"
            ./gradlew --no-daemon connectedDebugAndroidTest
            # Gradle/UTP tears down app data between connected-test invocations.
            # Install once, then run both fixtures directly so restart preserves data.
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            mkdir -p app/build/reports/wp08-ui
            adb shell am instrument -w -e class app.ascend.mobile.ui.FrontMeasurementScreenTest app.ascend.mobile.dev.test/androidx.test.runner.AndroidJUnitRunner > app/build/reports/wp08-ui/smoke.txt
            python3 scripts/check_instrumentation_result.py app/build/reports/wp08-ui/smoke.txt
            adb exec-out run-as app.ascend.mobile.dev cat files/wp08-synthetic-debug.png > app/build/reports/wp08-ui/synthetic-debug.png
            mkdir -p app/build/reports/storage-process
            adb shell am instrument -w -e class app.ascend.mobile.storage.StorageProcessDeathTest#a_seed app.ascend.mobile.dev.test/androidx.test.runner.AndroidJUnitRunner > app/build/reports/storage-process/seed.txt
            cat app/build/reports/storage-process/seed.txt
            python3 scripts/check_instrumentation_result.py app/build/reports/storage-process/seed.txt
            adb shell am force-stop app.ascend.mobile.dev
            adb shell am instrument -w -e class app.ascend.mobile.storage.StorageProcessDeathTest#b_verifyAfterRestart app.ascend.mobile.dev.test/androidx.test.runner.AndroidJUnitRunner > app/build/reports/storage-process/verify.txt
            cat app/build/reports/storage-process/verify.txt
            python3 scripts/check_instrumentation_result.py app/build/reports/storage-process/verify.txt
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-storage-reports
          path: |
            app/build/reports/androidTests/
            app/build/reports/storage-process/
            app/build/reports/wp08-ui/
            app/build/outputs/androidTest-results/
